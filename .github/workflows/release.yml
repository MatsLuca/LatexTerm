name: Release

# Push a tag like v0.2.0 → build, ad-hoc sign, zip, publish the GitHub release.
# Release text: .github/release-notes/<tag>.md (falls back to generated notes).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain || echo "Metal toolchain already present or not required"

      - name: Check version matches tag
        run: |
          version=$(xcodebuild -project LatexTerm.xcodeproj -scheme LatexTerm -showBuildSettings 2>/dev/null \
            | awk '/ MARKETING_VERSION =/ {print $3; exit}')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "MARKETING_VERSION $version ≠ tag $GITHUB_REF_NAME"; exit 1; }

      - name: Build
        run: |
          xcodebuild \
            -project LatexTerm.xcodeproj \
            -scheme LatexTerm \
            -configuration Release \
            -derivedDataPath .build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Ad-hoc sign and zip
        run: |
          app=.build/Build/Products/Release/LatexTerm.app
          xattr -cr "$app"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          ditto -c -k --keepParent "$app" "LatexTerm-$GITHUB_REF_NAME-macos.zip"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=.github/release-notes/$GITHUB_REF_NAME.md
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
          gh release create "$GITHUB_REF_NAME" "LatexTerm-$GITHUB_REF_NAME-macos.zip" \
            --verify-tag --title "$GITHUB_REF_NAME" "$@"
